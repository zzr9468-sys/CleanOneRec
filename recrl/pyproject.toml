[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recrl"
version = "0.1.0"
description = "Reinforcement Learning Framework for Recommendation LLMs"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["reinforcement learning", "recommendation", "llm", "grpo", "eepo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "trl>=0.7.0",
    "datasets>=2.0.0",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "sentence-transformers>=2.2.0",
    "accelerate>=0.20.0",
    "peft>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/recrl"
Documentation = "https://github.com/yourusername/recrl/blob/main/README.md"
Repository = "https://github.com/yourusername/recrl"

[tool.setuptools.packages.find]
where = ["."]
include = ["recrl*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
