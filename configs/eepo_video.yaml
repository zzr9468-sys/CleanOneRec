# EEPO training config for video recommendation
# Usage:
#   python train.py --config configs/eepo_video.yaml --algo eepo

model_path:  /data/zhouziren/ms/OneRec-1.7B
data_path:   /data/zhouziren/ms/OpenOneRec-RecIF/benchmark_data/video/video_test.parquet
recif_path:  /data/zhouziren/ms/OpenOneRec-RecIF
algo:        eepo

# Training
num_epochs:                1
per_device_batch_size:     4
gradient_accumulation_steps: 2
learning_rate:             1.0e-6
warmup_steps:              10
max_grad_norm:             1.0

# Generation
num_generations:           8
max_completion_length:     128
temperature:               0.9   # higher temp for exploration

# RL
beta: 0.04

# EEPO-specific
eepo_enabled:       true
eepo_stage1_ratio:  0.5      # G/2 exploit, G/2 explore
eepo_unlearn_lr:    1.0e-5
eepo_unlearn_weight: 1.0
eepo_epsilon:       1.0e-4
add_gt:             false

# Reward weights
reward_weights:
  longview:  0.50
  semantic:  0.30
  novelty:   0.15
  diversity: 0.05

# Logging
logging_steps: 1
save_steps:    200
