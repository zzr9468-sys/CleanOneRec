# EEPO training config for video recommendation
# Usage:
#   Single GPU:  python train.py --config configs/eepo_video.yaml
#   Multi-GPU:   accelerate launch --num_processes 4 train.py --config configs/eepo_video.yaml

model_path:  /data/zhouziren/ms/OneRec-1.7B
data_path:   /data/zhouziren/ms/OpenOneRec-RecIF/benchmark_data/video/video_test.parquet
recif_path:  /data/zhouziren/ms/OpenOneRec-RecIF
algo:        eepo
device:      cuda:0

# Training
num_epochs:                1
per_device_batch_size:     2
gradient_accumulation_steps: 4
learning_rate:             5.0e-6
warmup_steps:              50
max_grad_norm:             1.0

# Generation
num_generations:           4
max_completion_length:     128
temperature:               0.7

# RL
beta: 0.04

# EEPO specific
eepo_enabled:       true
eepo_stage1_ratio:  0.5      # 50% exploitation, 50% exploration
eepo_unlearn_lr:    1.0e-3   # Fast-weight learning rate
eepo_unlearn_weight: 0.1     # Unlearning weight
eepo_epsilon:       1.0e-8   # Numerical stability
add_gt:             false    # Don't inject ground truth

# Reward weights (must sum to 1.0)
reward_weights:
  longview:  0.50
  semantic:  0.30
  novelty:   0.15
  diversity: 0.05

# Logging
logging_steps: 1
save_steps:    200
